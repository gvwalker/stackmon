name: CI

'on':
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Verify release tooling
        run: python3 scripts/test_release.py

      - name: Verify formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "The following files are not formatted properly:"
            gofmt -l .
            exit 1
          fi

      - name: Run vet
        run: go vet ./...

      - name: Install syscall tracing for update durability scenarios
        run: sudo apt-get update && sudo apt-get install -y strace

      - name: Run tests with race detector
        env:
          STACKMON_TEST_DURABILITY: '1'
        run: go test -v -race ./... -count=1

      - name: Retain verification transcripts
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: verification-transcripts
          overwrite: true
          path: |
            e2e/out/transcript.txt
            e2e/out/update-durability.txt
            scripts/out/release-transcript.txt

  changes:
    name: Detect artifact changes
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.filter.outputs.build }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check whether build inputs changed
        id: filter
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "$BEFORE" = '0000000000000000000000000000000000000000' ] || ! git diff --quiet "$BEFORE" "$AFTER" -- cmd internal go.mod go.sum .github/workflows/ci.yml; then
            echo 'build=true' >> "$GITHUB_OUTPUT"
          else
            echo 'build=false' >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build (${{ matrix.os }}/${{ matrix.arch }})
    needs: [check, changes]
    if: >-
      always() && needs.check.result == 'success' &&
      ((github.event_name == 'push' && needs.changes.outputs.build == 'true') ||
      github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: darwin
            arch: arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build binary
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          VERSION: dev
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" -o dist/stackmon-${{ matrix.os }}-${{ matrix.arch }} ./cmd/stackmon

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: stackmon-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/stackmon-${{ matrix.os }}-${{ matrix.arch }}
          if-no-files-found: error
