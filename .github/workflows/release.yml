name: Release

'on':
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. v0.5.0. Leave empty to derive it from the commits since the last tag.'
        required: false
        type: string
      dry_run:
        description: 'Plan the release and print the notes without tagging or publishing.'
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  # Tagging, pushing, and creating the release all need the contents write.
  contents: write
  # Reading the merged PRs the release notes are built from.
  pull-requests: read

# Two releases tagging the same range at once would race for the same version.
concurrency:
  group: release
  cancel-in-progress: false

env:
  # The commit the release is built from and tagged at. Fixed at plan time so
  # the plan, the binaries, and the tag cannot disagree.
  SHA: ${{ github.sha }}

jobs:
  plan:
    name: Plan release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      previous: ${{ steps.plan.outputs.previous_tag }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Full history brings the tags, but the remote-tracking ref for main is
      # what proves the commit being released is on main.
      - name: Fetch main
        run: git fetch origin main

      - name: Choose version and write release notes
        id: plan
        env:
          INPUT_VERSION: ${{ inputs.version }}
          # Reading merged PRs is what the notes are made of, so gh needs a
          # token here just as much as it does when creating the release.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./scripts/release-plan.sh release-notes.md >> "$GITHUB_OUTPUT"
          cat release-notes.md

      - name: Summarise the plan
        if: ${{ always() }}
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          PREVIOUS: ${{ steps.plan.outputs.previous_tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          {
            echo "## Release plan"
            echo
            echo "\`${PREVIOUS:-none}\` -> \`${VERSION:-planning failed, see the log}\`"
            if [ "$DRY_RUN" = 'true' ]; then
              echo
              echo 'Dry run: nothing was tagged, built, or published.'
            fi
            echo
            cat release-notes.md 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release notes
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md

  publish:
    name: Build and publish ${{ needs.plan.outputs.version }}
    needs: plan
    # A dry run stops here: the version and notes were printed, nothing else
    # happened.
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the commit being released
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0

      - name: Download release notes
        uses: actions/download-artifact@v7
        with:
          name: release-notes

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      # The tag is only worth having if the code at it passes what main has to
      # pass, so the same gates CI runs are re-run before anything is tagged.
      - name: Verify formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo 'The following files are not formatted properly:'
            gofmt -l .
            exit 1
          fi

      - name: Run vet
        run: go vet ./...

      - name: Run tests with race detector
        run: go test -race ./...

      - name: Build binaries
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          for target in linux-amd64 linux-arm64 darwin-arm64; do
            GOOS=${target%-*} GOARCH=${target#*-} \
              go build -trimpath -ldflags="-s -w -X main.version=${{ needs.plan.outputs.version }}" \
              -o "dist/stackmon-$target" ./cmd/stackmon
          done

      - name: Generate checksums
        run: |
          cd dist
          sha256sum stackmon-* > checksums.txt

      - name: Create tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          git tag -a "$VERSION" -m "stackmon $VERSION" "$SHA"
          git push origin "refs/tags/$VERSION"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          gh release create "$VERSION" \
            dist/stackmon-* \
            dist/checksums.txt \
            --title "$VERSION" \
            --notes-file release-notes.md
