name: Release

'on':
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. v0.5.0. Leave empty to derive it from the commits since the last tag.'
        required: false
        type: string
      plan_run_id:
        description: 'Reuse the exact plan from an original completed Release run (dry run or failed publication). Leave version empty.'
        required: false
        type: string
      dry_run:
        description: 'Plan the release and print the notes without tagging or publishing.'
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  # Tagging, pushing, and creating the release all need the contents write.
  contents: write
  # Reading the merged PRs the release notes are built from.
  pull-requests: read

# Two releases tagging the same range at once would race for the same version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: Plan release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      previous: ${{ steps.plan.outputs.previous_tag }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Full history brings the tags, but the remote-tracking ref for main is
      # what proves the commit being released is on main.
      - name: Fetch main
        run: git fetch origin main

      - name: Choose version and write release notes
        id: plan
        env:
          INPUT_VERSION: ${{ inputs.version }}
          PLAN_RUN_ID: ${{ inputs.plan_run_id }}
          # Reading merged PRs is what the notes are made of, so gh needs a
          # token here just as much as it does when creating the release.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$PLAN_RUN_ID" ]; then
            if [ -n "$INPUT_VERSION" ]; then
              echo 'A saved plan and a new version override cannot be combined.' >&2
              exit 1
            fi
            python3 scripts/release.py restore-plan "$PLAN_RUN_ID" >> "$GITHUB_OUTPUT"
          else
            ./scripts/release-plan.sh release-notes.md >> "$GITHUB_OUTPUT"
          fi
          cat release-notes.md

      - name: Summarise the plan
        if: ${{ always() }}
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          PREVIOUS: ${{ steps.plan.outputs.previous_tag }}
          RELEASE_SHA: ${{ steps.plan.outputs.sha }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          {
            echo "## Release plan"
            echo
            echo "\`${PREVIOUS:-none}\` -> \`${VERSION:-planning failed, see the log}\`"
            echo
            echo "Commit: \`$RELEASE_SHA\`"
            if [ -f release-notes.json ]; then
              echo
              jq -r '.changes[] | select(.included == false) | "- Omitted \(.sha[0:8]): \(.reason)"' release-notes.json
            fi
            if [ "$DRY_RUN" = 'true' ]; then
              echo
              echo 'Dry run: nothing was tagged, built, or published.'
            fi
            echo
            cat release-notes.md 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release plan
        uses: actions/upload-artifact@v7
        with:
          name: release-plan
          overwrite: true
          path: |
            release-notes.md
            release-notes.json
          if-no-files-found: error

  publish:
    name: Build and publish ${{ needs.plan.outputs.version }}
    needs: plan
    # A dry run stops here: the version and notes were printed, nothing else
    # happened.
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the commit being released
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0

      - name: Download release plan
        uses: actions/download-artifact@v7
        with:
          name: release-plan

      - name: Verify saved plan and checkout
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin main --tags
          python3 scripts/release.py verify release-notes.json release-notes.md

      - name: Verify release tooling
        run: python3 scripts/test_release.py

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      # The tag is only worth having if the code at it passes what main has to
      # pass, so the same gates CI runs are re-run before anything is tagged.
      - name: Verify formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo 'The following files are not formatted properly:'
            gofmt -l .
            exit 1
          fi

      - name: Run vet
        run: go vet ./...

      - name: Run tests with race detector
        run: go test -race ./... -count=1

      - name: Retain verification transcripts
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: release-verification-transcripts
          overwrite: true
          path: |
            e2e/out/transcript.txt
            scripts/out/release-transcript.txt

      - name: Build binaries
        env:
          CGO_ENABLED: '0'
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          mkdir -p dist
          for target in linux-amd64 linux-arm64 darwin-arm64; do
            GOOS=${target%-*} GOARCH=${target#*-} \
              go build -trimpath -ldflags="-s -w -X main.version=$VERSION" \
              -o "dist/stackmon-$target" ./cmd/stackmon
          done

      # stackmon no longer reads this file: it verifies a download against
      # the sha256 digest GitHub publishes for each release asset, which is
      # the same hash the release page shows. This stays because every
      # stackmon built before that change looks for checksums.txt and
      # refuses to install a release without it -- a break we cannot fix
      # from the new side, since a released binary is what does the
      # updating. Delete this only when no such binary is left in the wild
      # and none is likely to come back, which there is no way to observe.
      # It costs four lines of YAML and 262 bytes beside 30MB of binaries.
      - name: Generate checksums
        run: |
          cd dist
          sha256sum stackmon-* > checksums.txt

      - name: Publish or resume the verified release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/release.py publish release-notes.json release-notes.md dist
